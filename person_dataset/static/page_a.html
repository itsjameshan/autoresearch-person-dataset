<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>网页 A — 大图滑窗检测</title>
    <style>
        body { font-family: "Microsoft YaHei", sans-serif; padding: 20px; background: #f0f4ff; margin: 0; }
        .card { background: #fff; padding: 20px; border-radius: 12px; max-width: 720px; margin: 0 auto; box-shadow: 0 2px 12px rgba(0,0,0,0.08); }
        .btn { margin: 6px 6px 0 0; padding: 8px 14px; border: none; border-radius: 8px; cursor: pointer; background: #dbeafe; color: #1e40af; font-size: 14px; }
        .btn-green { background: #22c55e; color: #fff; }
        .btn-orange { background: #f97316; color: #fff; }
        .btn-b { background: #2563eb; color: #fff; font-weight: 600; padding: 10px 18px; font-size: 15px; }
        .nav-b { margin: 0 0 16px 0; padding: 14px 16px; background: #eff6ff; border: 1px solid #bfdbfe; border-radius: 10px; }
        .nav-b .row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-top: 8px; }
        .hint { font-size: 13px; color: #64748b; line-height: 1.5; }
        a { color: #2563eb; }
    </style>
</head>
<body>
    <div class="card">
        <p style="margin:0 0 8px 0;"><a href="/">← 体育场检测主页</a></p>

        <div class="nav-b">
            <strong style="color:#1e40af;">去网页 B（拼接 + 全局 NMS + 导出）</strong>
            <div class="row">
                <button type="button" class="btn btn-b" onclick="window.location.href='/b'">① 打开网页 B</button>
                <button type="button" class="btn btn-b" style="background:#1d4ed8;" onclick="window.open('/b','_blank')">① 新标签页打开 B</button>
            </div>
            <p class="hint" style="margin:10px 0 0 0;">随时可点，不依赖是否已跑检测。若已跑完 pipeline_a，请用下方「② 带着 JSON 去 B」可自动填好数据。</p>
        </div>

        <p style="margin:0;">
            <a id="linkPipelineB" href="/b" target="_blank">网页 B 直链</a>
            <span class="hint">（与按钮相同，仅文字链接）</span>
        </p>

        <h3 style="margin-top:16px;">网页 A：滑动裁块 (1280) + 检测</h3>
        <p class="hint">与主页同一端口。上传大图 → 滑窗推理 → 得到 JSON 后再去 B 做合并统计。</p>
        <p class="hint">默认 conf/iou 与下方一致，也可用表单扩展。</p>
        <label>重叠 overlap (px)：</label>
        <input type="number" id="overlap" value="200" min="0" max="1279" style="width:80px">
        <label style="margin-left:12px">conf：</label>
        <input type="number" id="conf" value="0.35" step="0.05" min="0" max="1" style="width:56px">
        <label style="margin-left:8px">iou：</label>
        <input type="number" id="iou" value="0.25" step="0.05" min="0" max="1" style="width:56px">
        <div style="margin-top:10px">
            <input type="file" id="bigFile" accept="image/*" hidden>
            <button type="button" class="btn" onclick="document.getElementById('bigFile').click()">选择大图</button>
            <button type="button" class="btn btn-green" id="btnRunA" onclick="runPipelineA()">运行 pipeline_a</button>
        </div>
        <p id="aStatus" style="margin-top:12px;color:#666;"></p>
        <textarea id="aJson" rows="14" style="width:100%;font-size:12px;margin-top:10px;box-sizing:border-box;" placeholder="pipeline_a 返回的 JSON"></textarea>
        <button type="button" class="btn btn-orange" style="margin-top:8px" onclick="copyAtoClipboard()">复制 JSON</button>
        <button type="button" class="btn btn-green" style="margin-top:8px;font-weight:600;" onclick="sendToPageB()">② 带着 JSON 去网页 B</button>
    </div>
    <script src="/static/js/page_a.js"></script>
</body>
</html>
