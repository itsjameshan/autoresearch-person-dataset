<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>体育场人群检测 · 首页</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", sans-serif;
        }
        body {
            background-color: #f0f4ff;
            color: #1e293b;
            overflow: hidden;
        }
        .home-container {
            display: flex;
            width: 100vw;
            height: 100vh;
            background: #f0f4ff;
        }
        .home-sidebar {
            width: 240px;
            background: white;
            border-radius: 20px;
            margin: 15px;
            padding: 20px 15px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
        }
        .logo-area {
            text-align: center;
            margin-bottom: 30px;
        }
        .logo-area h2 {
            color: #2d6a4f;
            font-size: 22px;
            font-weight: 700;
            letter-spacing: 1px;
        }
        .logo-area p {
            color: #5f7b6e;
            font-size: 12px;
            margin-top: 6px;
        }
        .nav-menu {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 18px;
            border-radius: 16px;
            background: transparent;
            border: none;
            color: #1e3c2c;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            text-align: left;
        }
        .nav-item .icon {
            font-size: 22px;
            width: 28px;
        }
        .nav-item:hover {
            background: #e9f3ee;
        }
        .nav-item.active {
            background: #2d6a4f;
            color: white;
            box-shadow: 0 4px 10px rgba(45,106,79,0.2);
        }
        .nav-divider {
            height: 1px;
            background: #d0dde9;
            margin: 15px 0;
        }
        .home-main {
            flex: 1;
            margin: 15px 15px 15px 0;
            background: white;
            border-radius: 30px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.05);
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
        .welcome-icon {
            font-size: 80px;
            margin-bottom: 20px;
        }
        .home-main h1 {
            font-size: 42px;
            color: #1e3c2c;
            margin-bottom: 16px;
            font-weight: 700;
        }
        .home-main p {
            font-size: 18px;
            color: #4a6656;
            max-width: 600px;
            margin-bottom: 30px;
            line-height: 1.6;
        }
        .quick-action {
            background: #f8fafc;
            padding: 24px 40px;
            border-radius: 60px;
            border: 1px dashed #2d6a4f;
        }
        .quick-action span {
            color: #2d6a4f;
            font-weight: 600;
            font-size: 18px;
        }
        .footer-note {
            margin-top: 40px;
            color: #8aa79a;
            font-size: 13px;
        }
    </style>
</head>
<body>
<div class="home-container">
    <div class="home-sidebar">
        <div class="logo-area">
            <h2>🏟️ 人群检测</h2>
            <p>体育场智能分析系统</p>
        </div>
        <div class="nav-menu">
            <button class="nav-item active" id="nav-home">
                <span class="icon">🏠</span> 首页
            </button>
            <button class="nav-item" id="nav-workflow">
                <span class="icon">⚙️</span> 批量处理工作流
            </button>
            <button class="nav-item" id="nav-history">
                <span class="icon">📋</span> 历史数据
            </button>
            <button class="nav-item" id="nav-profile">
                <span class="icon">👤</span> 个人中心
            </button>
        </div>
        <div class="nav-divider"></div>
        <div style="font-size: 12px; color: #8aa79a; padding: 10px;">
            <div>当前模型: <span id="current-model-display">加载中...</span></div>
            <div style="margin-top: 6px;">© 2026 体育场检测</div>
        </div>
    </div>
    <div class="home-main">
        <div class="welcome-icon">🏟️</div>
        <h1>欢迎使用体育场人群检测系统</h1>
        <p>通过批量处理工作流，您可以对体育场看台大图进行裁剪、智能检测与结果重建，高效统计观众人数。</p>
        <div class="quick-action">
            <span>👉 点击左侧「批量处理工作流」开始</span>
        </div>
        <div class="footer-note">
            支持 YOLO 模型 · GPU 加速 · 结果自动保存
        </div>
    </div>
</div>
<!-- 引入外部 JS 文件 -->
<script src="/static/js/index.js"></script>
</body>
</html>
