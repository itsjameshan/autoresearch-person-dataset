<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录/注册 - 体育场人群检测系统</title>
    <link rel="stylesheet" href="/static/css/login.css">
</head>
<body>
<div class="login-container">
    <div class="login-header">
        <h1>🏟️ 人群检测</h1>
        <p>体育场智能分析系统</p>
    </div>
    <!-- 选项卡切换 -->
    <div class="tab-bar">
        <button id="tabLogin" class="tab-btn active">登录</button>
        <button id="tabRegister" class="tab-btn">注册</button>
    </div>

    <!-- 登录表单 -->
    <form id="loginForm" class="auth-form active">
        <div class="form-group">
            <label>👤 用户名</label>
            <input type="text" id="loginUsername" placeholder="请输入用户名" required>
        </div>
        <div class="form-group">
            <label>🔒 密码</label>
            <input type="password" id="loginPassword" placeholder="请输入密码" required>
        </div>
        <div class="error-msg" id="loginError"></div>
        <button type="submit" class="auth-btn">登 录</button>
    </form>

    <!-- 注册表单 -->
    <form id="registerForm" class="auth-form">
        <div class="form-group">
            <label>👤 用户名</label>
            <input type="text" id="regUsername" placeholder="至少3位" required>
        </div>
        <div class="form-group">
            <label>🔒 密码</label>
            <input type="password" id="regPassword" placeholder="至少6位" required>
        </div>
        <div class="form-group">
            <label>✓ 确认密码</label>
            <input type="password" id="regConfirm" placeholder="再次输入密码" required>
        </div>
        <div class="error-msg" id="regError"></div>
        <button type="submit" class="auth-btn">注 册</button>
    </form>

    <div class="footer-note" id="footerNote">
        演示账号：admin / admin123
    </div>
</div>

<script src="/static/js/login.js"></script>
</body>
</html>
